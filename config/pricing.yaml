# Price per 1 million tokens, in EUR. Copy the values from each provider's pricing page.
# Model names are matched by prefix, so "gpt-4.1-mini" also matches "gpt-4.1-mini-2025-04-14".
# Free-tier models cost 0 to you; enter the paid list price instead
# if you want the cost panel to show what the run WOULD cost.
# Models missing here are tracked with a cost of 0 and marked "no price".

currency: USD

models:
  gemini-3.5-flash-lite: {input: 0.0, output: 0.0}
  gemini-2.5-flash:      {input: 0.0, output: 0.0}
  # Clef decision models (input guard). Cloudflare lists USD per 1M input tokens; output is free.
  # Every account gets 10,000 free Neurons per day (about 1.2M clef-flash tokens).
  clef-flash:             {input: 0.09, output: 0.0}
  clef:                   {input: 0.24, output: 0.0}
  # GLM via the aitokentracker proxy: copy the prices shown on the site
  glm-5.3:                {input: 1.40, output: 4.40}
  glm-5.3-flash:          {input: 0.15, output: 0.50}
  glm-5.3-flash-thinking: {input: 0.15, output: 0.50}
  glm-4.7:                {input: 0.60, output: 2.20}

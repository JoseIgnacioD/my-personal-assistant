<svg xmlns="http://www.w3.org/2000/svg" width="760" height="296" font-family="FreeSans, Helvetica, Arial, sans-serif" viewBox="0 0 760 296" role="img" aria-label="The evaluation: 13 prompts in, a pass rate out" font-size="13"><rect width="760" height="296" fill="#ffffff"/><defs><marker id="ev-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b9a92"></path></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="#1f1e1c">The evaluation: 13 prompts in, a pass rate out</text><g fill="none" stroke="#9b9a92" stroke-width="1.25"><path d="M184 84H206" marker-end="url(#ev-arrow)"></path><path d="M288 112V198" marker-end="url(#ev-arrow)"></path><path d="M472 200V114" marker-end="url(#ev-arrow)"></path><path d="M552 84H574" marker-end="url(#ev-arrow)"></path></g><text x="296" y="160" font-size="11.5" fill="#5e5d58">prompt + expected result</text><text x="480" y="160" font-size="11.5" fill="#5e5d58">what Yerbis did</text><g><rect x="24" y="56" width="160" height="56" rx="8" fill="none" fill-opacity="1" stroke="#9b9a92" stroke-width="1.25"></rect><text x="104" y="80" text-anchor="middle" font-weight="600" fill="#1f1e1c">Test cases</text><text x="104" y="96" text-anchor="middle" font-size="11.5" fill="#5e5d58">13 prompts + expectations</text></g><g><rect x="208" y="56" width="160" height="56" rx="8" fill="none" fill-opacity="1" stroke="#9b9a92" stroke-width="1.25"></rect><text x="288" y="80" text-anchor="middle" font-weight="600" fill="#1f1e1c">Ask Jarvis</text><text x="288" y="96" text-anchor="middle" font-size="11.5" fill="#5e5d58">one prompt every 20 s</text></g><g><rect x="392" y="56" width="160" height="56" rx="8" fill="none" fill-opacity="1" stroke="#9b9a92" stroke-width="1.25"></rect><text x="472" y="80" text-anchor="middle" font-weight="600" fill="#1f1e1c">Score</text><text x="472" y="96" text-anchor="middle" font-size="11.5" fill="#5e5d58">blocked, agents, approval</text></g><g><rect x="576" y="56" width="160" height="56" rx="8" fill="none" fill-opacity="1" stroke="#9b9a92" stroke-width="1.25"></rect><text x="656" y="80" text-anchor="middle" font-weight="600" fill="#1f1e1c">Summary</text><text x="656" y="96" text-anchor="middle" font-size="11.5" fill="#5e5d58">pass rate, latency, cost</text></g><g><rect x="208" y="200" width="344" height="72" rx="8" fill="#2f6fde" fill-opacity="0.12" stroke="#2f6fde" stroke-width="2"></rect><text x="380" y="224" text-anchor="middle" font-weight="600" fill="#1f1e1c">Yerbis API: POST /eval</text><text x="380" y="240" text-anchor="middle" font-size="11.5" fill="#1f1e1c">runs the full Yerbis graph in a fresh conversation</text><text x="380" y="256" text-anchor="middle" font-size="11.5" fill="#1f1e1c">actions are recorded, then auto-rejected</text></g></svg>
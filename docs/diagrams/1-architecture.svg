er-end="url(#a2-arrow)"></path><path d="M284 564V594" marker-end="url(#a2-arrow)"></path><path d="M612 684V698" marker-end="url(#a2-arrow)"></path><path d="M40 728H12V92H38" marker-end="url(#a2-arrow)"></path><path d="M380 772V802" marker-end="url(#a2-arrow)"></path></g><text x="154" y="144" font-size="11.5" fill="#5e5d58">eval runs the graph</text><text x="478" y="144" font-size="11.5" fill="#5e5d58">chat runs the graph</text><text x="316" y="266" font-size="11.5" fill="#5e5d58">specialists called as tools</text><text x="316" y="480" font-size="11.5" fill="#5e5d58">MCP tool calls</text><text x="292" y="584" font-size="11.5" fill="#5e5d58">HTTP webhooks + shared secret</text><g><rect x="40" y="56" width="212" height="72" rx="8" fill="none" fill-opacity="1" stroke="#9b9a92" stroke-width="1.25"></rect><text x="146" y="80" text-anchor="middle" font-weight="600" fill="#1f1e1c">Yerbis API</text><text x="146" y="96" text-anchor="middle" font-size="11.5" fill="#5e5d58">POST /eval for the n8n</text><text x="146" y="112" text-anchor="middle" font-size="11.5" fill="#5e5d58">evaluation workflow</text></g><g><rect x="284" y="56" width="308" height="72" rx="8" fill="none" fill-opacity="1" stroke="#9b9a92" stroke-width="1.25"></rect><text x="438" y="80" text-anchor="middle" font-weight="600" fill="#1f1e1c">Chainlit web app</text><text x="438" y="96" text-anchor="middle" font-size="11.5" fill="#5e5d58">Chat, agent steps, approval buttons,</text><text x="438" y="112" text-anchor="middle" font-size="11.5" fill="#5e5d58">cost sidebar, model profile switch</text></g><g><rect x="40" y="196" width="152" height="56" rx="8" fill="none" fill-opacity="1" stroke="#9b9a92" stroke-width="1.25"></rect><text x="116" y="220" text-anchor="middle" font-weight="600" fill="#1f1e1c">input_guard</text><text x="116" y="236" text-anchor="middle" font-size="11.5" fill="#5e5d58">rules + Clef</text></g><g><rect x="232" y="196" width="152" height="56" rx="8" fill="#2f6fde" fill-opacity="0.12" stroke="#2f6fde" stroke-width="2"></rect><text x="308" y="220" text-anchor="middle" font-weight="600" fill="#1f1e1c">Orchestrator</text><text x="308" y="236" text-anchor="middle" font-size="11.5" fill="#1f1e1c">picks specialists</text></g><g><rect x="424" y="196" width="152" height="56" rx="8" fill="none" fill-opacity="1" stroke="#9b9a92" stroke-width="1.25"></rect><text x="500" y="220" text-anchor="middle" font-weight="600" fill="#1f1e1c">output_guard</text><text x="500" y="236" text-anchor="middle" font-size="11.5" fill="#5e5d58">redacts secrets</text></g><g><rect x="40" y="292" width="152" height="56" rx="8" fill="none" fill-opacity="1" stroke="#9b9a92" stroke-width="1.25"></rect><text x="116" y="316" text-anchor="middle" font-weight="600" fill="#1f1e1c">Calendar agent</text><text x="116" y="332" text-anchor="middle" font-size="11.5" fill="#5e5d58">calendar + weather</text></g><g><rect x="232" y="292" width="152" height="56" rx="8" fill="none" fill-opacity="1" stroke="#9b9a92" stroke-width="1.25"></rect><text x="308" y="316" text-anchor="middle" font-weight="600" fill="#1f1e1c">Email agent</text><text x="308" y="332" text-anchor="middle" font-size="11.5" fill="#5e5d58">read, search, send</text></g><g><rect x="424" y="292" width="152" height="56" rx="8" fill="none" fill-opacity="1" stroke="#9b9a92" stroke-width="1.25"></rect><text x="500" y="316" text-anchor="middle" font-weight="600" fill="#1f1e1c">Tasks agent</text><text x="500" y="332" text-anchor="middle" font-size="11.5" fill="#5e5d58">add, list, complete</text></g><g><rect x="40" y="388" width="344" height="56" rx="8" fill="none" fill-opacity="1" stroke="#9b9a92" stroke-width="1.25"></rect><text x="212" y="412" text-anchor="middle" font-weight="600" fill="#1f1e1c">Approval wrapper</text><text x="212" y="428" text-anchor="middle" font-size="11.5" fill="#5e5d58">send email, create or move event ask you first</text></g><g><rect x="424" y="388" width="152" height="56" rx="8" fill="none" fill-opacity="1" stroke="#9b9a92" stroke-width="1.25"></rect><text x="500" y="412" text-anchor="middle" font-weight="600" fill="#1f1e1c">Cost tracker</text><text x="500" y="428" text-anchor="middle" font-size="11.5" fill="#5e5d58">tokens per agent</text></g><g><rect x="616" y="196" width="120" height="112" rx="8" fill="none" fill-opacity="1" stroke="#9b9a92" stroke-width="1.25"></rect><text x="676" y="220" text-anchor="middle" font-weight="600" fill="#1f1e1c">LLM provider</text><text x="676" y="238" text-anchor="middle" font-size="11.5" fill="#5e5d58">Gemini, OpenAI,</text><text x="676" y="254" text-anchor="middle" font-size="11.5" fill="#5e5d58">GLM proxy</text><text x="676" y="270" text-anchor="middle" font-size="11.5" fill="#5e5d58">via models.yaml</text></g><g><rect x="616" y="332" width="120" height="112" rx="8" fill="none" fill-opacity="1" stroke="#9b9a92" stroke-width="1.25"></rect><text x="676" y="356" text-anchor="middle" font-weight="600" fill="#1f1e1c">Clef-flash</text><text x="676" y="374" text-anchor="middle" font-size="11.5" fill="#5e5d58">Cloudflare</text><text x="676" y="390" text-anchor="middle" font-size="11.5" fill="#5e5d58">decision model</text><text x="676" y="406" text-anchor="middle" font-size="11.5" fill="#5e5d58">for input_guard</text></g><g><rect x="24" y="492" width="520" height="72" rx="8" fill="none" fill-opacity="1" stroke="#9b9a92" stroke-width="1.25"></rect><text x="284" y="516" text-anchor="middle" font-weight="600" fill="#1f1e1c">MCP server (FastMCP, separate process)</text><text x="284" y="532" text-anchor="middle" font-size="11.5" fill="#5e5d58">10 tools: weather, calendar, email, tasks</text><text x="284" y="548" text-anchor="middle" font-size="11.5" fill="#5e5d58">Validates inputs, scans emails for injection</text></g><g><rect x="568" y="492" width="168" height="72" rx="8" fill="none" fill-opacity="1" stroke="#9b9a92" stroke-width="1.25"></rect><text x="652" y="516" text-anchor="middle" font-weight="600" fill="#1f1e1c">SQLite</text><text x="652" y="532" text-anchor="middle" font-size="11.5" fill="#5e5d58">data/jarvis.db</text><text x="652" y="548" text-anchor="middle" font-size="11.5" fill="#5e5d58">tasks, token usage</text></g><g><rect x="40" y="628" width="216" height="56" rx="8" fill="none" fill-opacity="1" stroke="#9b9a92" stroke-width="1.25"></rect><text x="148" y="652" text-anchor="middle" font-weight="600" fill="#1f1e1c">weather</text><text x="148" y="668" text-anchor="middle" font-size="11.5" fill="#5e5d58">geocode + forecast</text></g><g><rect x="272" y="628" width="216" height="56" rx="8" fill="none" fill-opacity="1" stroke="#9b9a92" stroke-width="1.25"></rect><text x="380" y="652" text-anchor="middle" font-weight="600" fill="#1f1e1c">calendar</text><text x="380" y="668" text-anchor="middle" font-size="11.5" fill="#5e5d58">HTTP Request nodes</text></g><g><rect x="504" y="628" width="216" height="56" rx="8" fill="none" fill-opacity="1" stroke="#9b9a92" stroke-width="1.25"></rect><text x="612" y="652" text-anchor="middle" font-weight="600" fill="#1f1e1c">email</text><text x="612" y="668" text-anchor="middle" font-size="11.5" fill="#5e5d58">Gmail nodes</text></g><g><rect x="40" y="700" width="216" height="56" rx="8" fill="none" fill-opacity="1" stroke="#9b9a92" stroke-width="1.25"></rect><text x="148" y="724" text-anchor="middle" font-weight="600" fill="#1f1e1c">evaluation</text><text x="148" y="740" text-anchor="middle" font-size="11.5" fill="#5e5d58">13 test prompts, scored</text></g><g><rect x="272" y="700" width="216" height="56" rx="8" fill="none" fill-opacity="1" stroke="#9b9a92" stroke-width="1.25"></rect><text x="380" y="724" text-anchor="middle" font-weight="600" fill="#1f1e1c">error_alert</text><text x="380" y="740" text-anchor="middle" font-size="11.5" fill="#5e5d58">emails you on failures</text></g><g><rect x="504" y="700" width="216" height="56" rx="8" fill="none" fill-opacity="1" stroke="#9b9a92" stroke-width="1.25"></rect><text x="612" y="724" text-anchor="middle" font-weight="600" fill="#1f1e1c">clean_email</text><text x="612" y="740" text-anchor="middle" font-size="11.5" fill="#5e5d58">subworkflow</text></g><g><rect x="24" y="804" width="712" height="56" rx="8" fill="none" fill-opacity="1" stroke="#9b9a92" stroke-width="1.25"></rect><text x="380" y="828" text-anchor="middle" font-weight="600" fill="#1f1e1c">External APIs</text><text x="380" y="844" text-anchor="middle" font-size="11.5" fill="#5e5d58">Open-Meteo, Google Calendar API, Gmail</text></g></svg>
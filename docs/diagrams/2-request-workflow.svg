<svg xmlns="http://www.w3.org/2000/svg" width="760" height="680" font-family="FreeSans, Helvetica, Arial, sans-serif" viewBox="0 0 760 680" role="img" aria-label="One request: guards first and last, agents loop until the job is done" font-size="13"><rect width="760" height="680" fill="#ffffff"/><defs><marker id="fl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b9a92"></path></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="#1f1e1c">One request: guards first and last, agents loop until the job is done</text><g fill="none" stroke="#9b9a92" stroke-width="1.25"><path d="M220 112V142" marker-end="url(#fl-arrow)"></path><path d="M220 200V230" marker-end="url(#fl-arrow)"></path><path d="M220 304V334" marker-end="url(#fl-arrow)"></path><path d="M220 392V422" marker-end="url(#fl-arrow)"></path><path d="M220 480V510" marker-end="url(#fl-arrow)"></path><path d="M220 568V598" marker-end="url(#fl-arrow)"></path><path d="M360 172H438" marker-end="url(#fl-arrow)"></path><path d="M360 268H438" marker-end="url(#fl-arrow)"></path><path d="M360 356H438" marker-end="url(#fl-arrow)"></path><path d="M440 376H362" marker-end="url(#fl-arrow)"></path><path d="M580 392V422" marker-end="url(#fl-arrow)"></path><path d="M580 480V510" marker-end="url(#fl-arrow)"></path><path d="M720 540H744V364H722" marker-end="url(#fl-arrow)"></path><path d="M720 452H744"></path></g><text x="228" y="220" font-size="11.5" fill="#5e5d58">within budget</text><text x="228" y="322" font-size="11.5" fill="#5e5d58">allowed</text><text x="228" y="410" font-size="11.5" fill="#5e5d58">nothing left to delegate</text><text x="399" y="164" text-anchor="middle" font-size="11.5" fill="#5e5d58">over limit</text><text x="399" y="260" text-anchor="middle" font-size="11.5" fill="#5e5d58">blocked</text><text x="399" y="328" text-anchor="middle" font-size="11.5" fill="#5e5d58">calls as a tool</text><text x="399" y="392" text-anchor="middle" font-size="11.5" fill="#5e5d58">result</text><text x="588" y="500" font-size="11.5" fill="#5e5d58">approved or safe tool</text><g><rect x="80" y="56" width="280" height="56" rx="8" fill="none" fill-opacity="1" stroke="#9b9a92" stroke-width="1.25" stroke-dasharray="none"></rect><text x="220" y="80" text-anchor="middle" font-weight="600" fill="#1f1e1c">You send a message</text><text x="220" y="96" text-anchor="middle" font-size="11.5" fill="#5e5d58">Chainlit chat or terminal</text></g><g><rect x="80" y="144" width="280" height="56" rx="8" fill="none" fill-opacity="1" stroke="#9b9a92" stroke-width="1.25" stroke-dasharray="none"></rect><text x="220" y="168" text-anchor="middle" font-weight="600" fill="#1f1e1c">Budget check</text><text x="220" y="184" text-anchor="middle" font-size="11.5" fill="#5e5d58">session cost and tokens so far</text></g><g><rect x="440" y="144" width="280" height="56" rx="8" fill="none" fill-opacity="1" stroke="#9b9a92" stroke-width="1.25" stroke-dasharray="5 4"></rect><text x="580" y="168" text-anchor="middle" font-weight="600" fill="#1f1e1c">Stop</text><text x="580" y="184" text-anchor="middle" font-size="11.5" fill="#5e5d58">session limit reached, no LLM call</text></g><g><rect x="80" y="232" width="280" height="72" rx="8" fill="none" fill-opacity="1" stroke="#9b9a92" stroke-width="1.25" stroke-dasharray="none"></rect><text x="220" y="256" text-anchor="middle" font-weight="600" fill="#1f1e1c">input_guard</text><text x="220" y="272" text-anchor="middle" font-size="11.5" fill="#5e5d58">masks card numbers and IBANs,</text><text x="220" y="288" text-anchor="middle" font-size="11.5" fill="#5e5d58">regex rules, then Clef-flash decides</text></g><g><rect x="440" y="240" width="280" height="56" rx="8" fill="none" fill-opacity="1" stroke="#9b9a92" stroke-width="1.25" stroke-dasharray="5 4"></rect><text x="580" y="264" text-anchor="middle" font-weight="600" fill="#1f1e1c">Refusal</text><text x="580" y="280" text-anchor="middle" font-size="11.5" fill="#5e5d58">explains why, no agents run</text></g><g><rect x="80" y="336" width="280" height="56" rx="8" fill="#2f6fde" fill-opacity="0.12" stroke="#2f6fde" stroke-width="2" stroke-dasharray="none"></rect><text x="220" y="360" text-anchor="middle" font-weight="600" fill="#1f1e1c">Orchestrator (LLM)</text><text x="220" y="376" text-anchor="middle" font-size="11.5" fill="#1f1e1c">answer now, or call a specialist?</text></g><g><rect x="440" y="336" width="280" height="56" rx="8" fill="none" fill-opacity="1" stroke="#9b9a92" stroke-width="1.25" stroke-dasharray="none"></rect><text x="580" y="360" text-anchor="middle" font-weight="600" fill="#1f1e1c">Specialist agent (LLM)</text><text x="580" y="376" text-anchor="middle" font-size="11.5" fill="#5e5d58">calendar, email or tasks: picks MCP tools</text></g><g><rect x="440" y="424" width="280" height="56" rx="8" fill="none" fill-opacity="1" stroke="#9b9a92" stroke-width="1.25" stroke-dasharray="none"></rect><text x="580" y="448" text-anchor="middle" font-weight="600" fill="#1f1e1c">Approval for risky tools</text><text x="580" y="464" text-anchor="middle" font-size="11.5" fill="#5e5d58">you approve, reject or ask for changes</text></g><g><rect x="440" y="512" width="280" height="56" rx="8" fill="none" fill-opacity="1" stroke="#9b9a92" stroke-width="1.25" stroke-dasharray="none"></rect><text x="580" y="536" text-anchor="middle" font-weight="600" fill="#1f1e1c">MCP tool, n8n, Google API</text><text x="580" y="552" text-anchor="middle" font-size="11.5" fill="#5e5d58">the result goes back to the specialist</text></g><g><rect x="80" y="424" width="280" height="56" rx="8" fill="none" fill-opacity="1" stroke="#9b9a92" stroke-width="1.25" stroke-dasharray="none"></rect><text x="220" y="448" text-anchor="middle" font-weight="600" fill="#1f1e1c">Final answer</text><text x="220" y="464" text-anchor="middle" font-size="11.5" fill="#5e5d58">orchestrator combines the results</text></g><g><rect x="80" y="512" width="280" height="56" rx="8" fill="none" fill-opacity="1" stroke="#9b9a92" stroke-width="1.25" stroke-dasharray="none"></rect><text x="220" y="536" text-anchor="middle" font-weight="600" fill="#1f1e1c">output_guard</text><text x="220" y="552" text-anchor="middle" font-size="11.5" fill="#5e5d58">redacts API keys and secrets</text></g><g><rect x="80" y="600" width="280" height="56" rx="8" fill="none" fill-opacity="1" stroke="#9b9a92" stroke-width="1.25" stroke-dasharray="none"></rect><text x="220" y="624" text-anchor="middle" font-weight="600" fill="#1f1e1c">Reply + cost table</text><text x="220" y="640" text-anchor="middle" font-size="11.5" fill="#5e5d58">tokens and euros per agent</text></g></svg>